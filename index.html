<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wallet 2.0</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#7c5cfc" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wallet 2.0" />

  <!-- charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          W
        </div>

        <div class="brand-text">
          <h1>Wallet 2.0</h1>
          <span>Portfolio Intelligence System</span>
        </div>

      </div>

      <div class="header-right">

        <span id="last-update">
          syncing...
        </span>

        <button id="refresh-btn">
          Refresh
        </button>

      </div>

    </header>

    <!-- NAV -->

    <nav class="nav">

      <button class="nav-btn active" data-view="dashboard">
        Dashboard
      </button>

      <button class="nav-btn" data-view="portfolio">
        Portfolio
      </button>

      <button class="nav-btn" data-view="performance">
        Performance
      </button>

      <button class="nav-btn" data-view="global">
        Global
      </button>

      <button class="nav-btn" data-view="prices">
        Prices
      </button>

    </nav>

    <!-- OWNER SELECT -->

    <section class="owner-bar">

      <select id="owner-select">

      </select>

    </section>

    <!-- CONTENT -->

    <main id="app">

      <div class="loading-screen">

        <div class="loader"></div>

        <p>
          Connecting Wallet 2.0...
        </p>

      </div>

    </main>

  </div>

  <!-- scripts -->

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
