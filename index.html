<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wallet 2.0</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7c5cfc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wallet 2.0" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">W</div>
        <div>
          <div class="logo-title">Wallet 2.0</div>
          <div class="logo-subtitle">ChatGPT build · beta</div>
        </div>
      </div>

      <div class="header-actions">
        <span id="lastUpdate" class="last-update">Sin datos</span>
        <button id="refreshBtn" class="btn">Actualizar</button>
      </div>
    </header>

    <nav class="nav">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="portfolio">Portfolio</button>
      <button class="nav-btn" data-view="performance">Performance</button>
      <button class="nav-btn" data-view="prices">Precios</button>
    </nav>

    <main id="appContent" class="content">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Conectando con Wallet 2.0...</p>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
